<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Rolled Away</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0f1115;
    --bg-2: #14171d;
    --steel: #b9c2cc;
    --steel-dark: #6b7480;
    --steel-line: #2a2f38;
    --orange: #ff7a1a;
    --orange-dim: #e6690f;
    --text-dim: #9aa2ad;
    --text-bright: #eef1f4;

    /* single source of truth for the coil size — everything below reads from this */
    --coil-size: clamp(4.6rem, 16.2vw, 9.6rem);

  --crane-duration: 11s;   /* ADD THIS LINE */
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background: var(--bg);
    color: var(--text-bright);
    font-family: 'Space Grotesk', sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
  }

  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    position:relative;
    padding: 60px 20px 50px;
  }

  /* ---------- background texture ---------- */
  .grid-overlay{
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 40%, transparent 85%);
    pointer-events:none;
    z-index:0;
  }

  .vignette{
    position:fixed;
    inset:0;
    background: radial-gradient(ellipse 90% 80% at 50% 30%, transparent 40%, rgba(0,0,0,0.55) 100%);
    pointer-events:none;
    z-index:1;
  }

  .fog-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
    overflow:hidden;
  }
  .fog-particle{
    position:absolute;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,255,255,0.05), transparent 70%);
    filter: blur(2px);
    animation: drift linear infinite;
  }
  @keyframes drift{
    0%{ transform: translate(0,0); opacity:0; }
    10%{ opacity:1; }
    90%{ opacity:1; }
    100%{ transform: translate(var(--dx), var(--dy)); opacity:0; }
  }

  .caution-strip{
    position:absolute;
    top:0; left:0; right:0;
    height:6px;
    background: repeating-linear-gradient(135deg, var(--orange) 0 18px, #14171d 18px 36px);
    opacity:0.85;
    z-index:2;
  }

  .hero{
    position:relative;
    z-index:3;
    width:100%;
    max-width:1000px;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-top: clamp(60px, 12vw, 140px);
  }

  .eyebrow{
    font-size: 0.72rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--orange);
    font-weight:600;
    margin-bottom: 18px;
    opacity:0;
    animation: fadeUp 0.9s ease forwards 0.3s;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .eyebrow::before, .eyebrow::after{
    content:"";
    width:26px; height:1px;
    background: var(--orange-dim);
    opacity:0.6;
  }

  .stage{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: clamp(4px, 1.4vw, 18px);
    width:100%;
    padding-top: 260px;
    margin-top: -260px;
  }

  .stage-glow{
    position:absolute;
    left:50%; top:58%;
    transform:translate(-50%,-50%);
    width: min(760px, 90vw);
    height: 420px;
    background: radial-gradient(ellipse at center, rgba(255,122,26,0.16), rgba(255,122,26,0.05) 45%, transparent 72%);
    filter: blur(10px);
    z-index:0;
    animation: breathe 5s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ opacity:0.7; transform:translate(-50%,-50%) scale(1); }
    50%{ opacity:1; transform:translate(-50%,-50%) scale(1.05); }
  }

  .digit{
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(5.2rem, 19vw, 11.5rem);
    line-height: 1;
    color: var(--text-bright);
    background: linear-gradient(180deg, #f2f4f6 0%, #c7ced6 45%, #8b939d 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    position:relative;
    z-index:2;
    filter: drop-shadow(0 12px 30px rgba(0,0,0,0.55));
    opacity:0;
    animation: fadeUp 0.9s ease forwards 0.15s;
    user-select:none;
  }
  .digit.second{ animation-delay: 0.35s; }

  /* coil-slot MUST match the digit's box so the coil centers exactly where the "0" belongs */
  .coil-slot{
    position:relative;
    width: var(--coil-size);
    height: clamp(5.2rem, 19vw, 11.5rem); /* matches .digit font-size / line-height:1 box */
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
    flex: 0 0 auto;
  }

  /* ===================== CRANE ===================== */
  .crane-rig{
    position:absolute;
    left:8%;
    top:8rem;
    width: 60px;/* to change   */
    max-width: 132vw;
    height: 300px;
    transform: translate(-124%, -420px);
    z-index: 5;
  animation: craneJourney var(--crane-duration) cubic-bezier(.45,.05,.25,1) forwards;
    pointer-events:none;
  }

  @keyframes craneJourney{
    0%{      transform: translate(-124%, -420px); }
    16%{     transform: translate(-56%, -6px); }
    22%{     transform: translate(-56%, -6px); }
    78%{     transform: translate(-56%, -6px); }
    86%{     transform: translate(-56%, -18px); }
    100%{    transform: translate(72%, -1020px); }
  }

  .mast{
    position:absolute;
    left: 18px;
    top: 0;
    width: 16px;
    height: 260px;
    background: repeating-linear-gradient(180deg, var(--orange) 0 22px, #b85a10 22px 24px);
    box-shadow: inset -3px 0 4px rgba(0,0,0,0.4), 2px 0 6px rgba(0,0,0,0.4);
    border-radius: 2px;
  }
  .mast::before{
    content:"";
    position:absolute;
    left:-9px; bottom:0;
    width:34px; height:14px;
    background: #23262d;
    border-radius:2px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }
  .mast::after{
    content:"";
    position:absolute;
    left:0; top:0;
    width:16px; height:100%;
    background: repeating-linear-gradient(45deg, transparent 0 9px, rgba(0,0,0,0.35) 9px 10px),
                repeating-linear-gradient(-45deg, transparent 0 9px, rgba(0,0,0,0.35) 9px 10px);
  }

  .counter-jib{
    position:absolute;
    left: -78px;
    top: 26px;
    width: 96px;
    height: 8px;
    background: linear-gradient(90deg, #4a4f58, var(--orange-dim));
    border-radius: 2px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.4);
  }
  .counterweight{
    position:absolute;
    left:-72px;
    top: 30px;
    width: 34px;
    height: 26px;
    background: linear-gradient(180deg,#3a3f47,#22262c);
    border-radius: 2px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.5);
  }

  .boom{
    position:absolute;
    left: 26px;
    top: 22px;
    width: 480px;
    height: 9px;
    background: linear-gradient(90deg, var(--orange) 0%, var(--orange-dim) 100%);
    border-radius: 2px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.45), inset 0 -2px 3px rgba(0,0,0,0.3);
  }
  .boom::after{
    content:"";
    position:absolute;
    inset:0;
    background: repeating-linear-gradient(90deg, rgba(0,0,0,0.25) 0 2px, transparent 2px 26px);
  }
  .tie-cable{
    position:absolute;
    left: 30px;
    top: -108px;
    width: 1px;
    height: 130px;
    background: linear-gradient(180deg, transparent, #565c66);
    transform-origin: top center;
    transform: rotate(24deg);
  }
  .tie-cable.two{ transform: rotate(9deg); left: 220px; }
  .cab{
    position:absolute;
    left: 6px;
    top: 30px;
    width: 30px;
    height: 22px;
    background: linear-gradient(180deg,#3a3f47,#1c1f24);
    border: 1px solid #4a4f58;
    border-radius: 3px 3px 2px 2px;
  }
  .cab::after{
    content:"";
    position:absolute;
    inset: 3px 4px 8px 4px;
    background: linear-gradient(160deg, rgba(255,178,110,0.5), rgba(120,150,190,0.25));
    border-radius:2px;
  }

  .trolley{
    position:absolute;
    top: 24px;
    left: 40px;
    width: 26px;
    height: 12px;
    background: linear-gradient(180deg,#3d434c,#1d2025);
    border-radius: 2px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.5);
    /* animation: trolleyMove 11s cubic-bezier(.45,.05,.25,1) forwards; */
    animation: trolleyMove var(--crane-duration) cubic-bezier(.45,.05,.25,1) forwards;
  }

  @keyframes trolleyMove{
    0%,20%{  left: 40px; }
    32%{     left: 440px; }
    82%{     left: 440px; }
    100%{    left: 440px; }
  }

  .cable-assembly{
    position:absolute;
    top: 36px;
    left: 28.2rem;
    width: 2px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .cable{
    width: 2px;
    background: linear-gradient(180deg, #6b7480, #3a3f47);
    height: 0px;
  animation: cableLength var(--crane-duration) cubic-bezier(.45,.05,.25,1) forwards;
  }
  @keyframes cableLength{
    0%,32%{   height: 0px; }
    46%{      height: 100px; }
    58%,74%{  height: 100px; }
    88%{      height: 0px; }
    100%{     height: 0px; }
  }
  .hook{
    width: 16px;
    height: 12px;
    margin-top: -1px;
    border: 3px solid #7c8492;
    border-top: none;
    border-radius: 0 0 9px 9px;
    opacity: 1;
     animation: hookFade var(--crane-duration) linear forwards;

  }
  @keyframes hookFade{
    0%,31%{ opacity:0; }
    33%{ opacity:1; }
    73%{ opacity:1; }
    76%{ opacity:0; }
    100%{ opacity:0; }
  }

  /* the coil hanging from the hook — fixed square box, driven by --coil-size */
  .coil-carried{
    width: var(--coil-size);
    /* height: var(--coil-size); */
    margin-top: 2px;
  animation: coilCarrySwing var(--crane-duration) cubic-bezier(.45,.05,.25,1) forwards;

    transform-origin: top center;
    filter: drop-shadow(0 18px 22px rgba(0,0,0,0.55));
    flex: 0 0 auto;
  }

  @keyframes coilCarrySwing{
    0%,32%{   opacity:0; transform: rotate(0deg) scale(0.9); }
    34%{      opacity:1; transform: rotate(-6deg) scale(1); }
    40%{      transform: rotate(5deg) scale(1); }
    46%{      transform: rotate(-2deg) scale(1); }
    52%{      transform: rotate(0deg) scale(1); }
    58%{      opacity:1; transform: rotate(0deg) scale(1) translateY(0px); }
    60%{      opacity:1; transform: translateY(-6px) scale(1.01); }
    63%{      opacity:0; transform: translateY(2px) scale(0.98); }
    100%{     opacity:0; }
  }

  /* ===================== FINAL COIL (the "0") ===================== */
  /* fixed square box, driven by the same --coil-size so it lands exactly where the digits expect */
 

  .coil-final{
    position:relative;
    width: var(--coil-size);
    /* height: var(--coil-size); */
    opacity: 0;
    animation:
    coilArrive 0.5s ease forwards calc(var(--crane-duration) * 0.573),
    coilFloat 4.5s ease-in-out infinite calc(var(--crane-duration) * 0.627),
    coilSpin 26s linear infinite calc(var(--crane-duration) * 0.627);

    filter: drop-shadow(0 20px 26px rgba(0,0,0,0.6));
  }
  @keyframes coilArrive{
    0%{ opacity:0; transform: scale(0.94); }
    40%{ opacity:1; transform: scale(1.035); }
    100%{ opacity:1; transform: scale(1); }
  }
  @keyframes coilFloat{
    0%,100%{ transform: translateY(0) rotate(-1.4deg); }
    50%{ transform: translateY(-7px) rotate(1.4deg); }
  }
  @keyframes coilSpin{
    0%{ filter: drop-shadow(0 20px 26px rgba(0,0,0,0.6)) brightness(1); }
    50%{ filter: drop-shadow(0 20px 26px rgba(0,0,0,0.6)) brightness(1.06); }
    100%{ filter: drop-shadow(0 20px 26px rgba(0,0,0,0.6)) brightness(1); }
  }

  /* shared image styling for BOTH the carried coil and the final coil —
     always fills its parent box exactly, never a fixed rem size */
  .coil{
    width: 10rem;
    height: 100%;
    object-fit: cover;
    /* border-radius: 50%; */
    display: block;
  }

  .coil-final .shine{
    position:absolute;
    inset:0;
    border-radius:50%;
    overflow:hidden;
    pointer-events:none;
  }
  .coil-final .shine::after{
    content:"";
    position:absolute;
    top:-30%;
    left:-160%;
    width:60%;
    height:160%;
    background: linear-gradient(75deg, transparent, rgba(255,255,255,0.55), transparent);
    transform: rotate(8deg);
    /* animation: sweep 4.5s ease-in-out infinite 7.4s; */
      animation: sweep 4.5s ease-in-out infinite calc(var(--crane-duration) * 0.673);

  }
  
  @keyframes sweep{
    0%{ left:-160%; }
    16%{ left:220%; }
    100%{ left:220%; }
  }

  .impact-ring{
    position:absolute;
    left:50%; bottom: 6px;
    width: 20px; height: 8px;
    transform: translateX(-50%) scale(0);
    border-radius:50%;
    background: radial-gradient(ellipse at center, rgba(255,122,26,0.55), transparent 70%);
    /* animation: ringPulse 0.6s ease-out forwards 6.15s; */
      animation: ringPulse 0.6s ease-out forwards calc(var(--crane-duration) * 0.559);

  }
  @keyframes ringPulse{
    0%{ transform: translateX(-50%) scale(0.3); opacity:0.9; }
    100%{ transform: translateX(-50%) scale(7); opacity:0; }
  }

  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(18px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .copy{
    position:relative;
    z-index:3;
    text-align:center;
    margin-top: clamp(34px, 6vw, 54px);
    max-width: 520px;
    opacity:0;
    animation: fadeUp 0.9s ease forwards 0.55s;
  }
  .copy h1{
    font-size: clamp(1.4rem, 3vw, 1.9rem);
    margin: 0 0 12px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .copy p{
    font-size: 0.98rem;
    line-height:1.6;
    color: var(--text-dim);
    margin: 0 0 34px;
  }

  .actions{
    display:flex;
    gap:16px;
    justify-content:center;
    flex-wrap:wrap;
  }

  .btn{
    position:relative;
    overflow:hidden;
    font-family:inherit;
    font-size:0.9rem;
    font-weight:600;
    letter-spacing:0.02em;
    padding: 14px 30px;
    border-radius: 8px;
    cursor:pointer;
    border:1px solid transparent;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:9px;
    transition: transform 0.35s cubic-bezier(.2,.8,.2,1), box-shadow 0.35s ease, border-color 0.35s ease;
  }
  .btn:active{ transform: translateY(1px) scale(0.98); }

  .btn-primary{
    background: linear-gradient(135deg, var(--orange), var(--orange-dim));
    color: #14100b;
    box-shadow: 0 8px 24px rgba(255,122,26,0.25);
  }
  .btn-primary::before{
    content:"";
    position:absolute;
    top:0; left:-60%;
    width:40%; height:100%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,0.55), transparent);
    transform: skewX(-20deg);
    transition: left 0.6s ease;
  }
  .btn-primary:hover{
    transform: translateY(-3px);
    box-shadow: 0 14px 32px rgba(255,122,26,0.4);
  }
  .btn-primary:hover::before{ left: 130%; }

  .btn-ghost{
    background: rgba(255,255,255,0.03);
    color: var(--text-bright);
    border-color: var(--steel-line);
  }
  .btn-ghost:hover{
    transform: translateY(-3px);
    border-color: var(--steel-dark);
    background: rgba(255,255,255,0.06);
    box-shadow: 0 10px 26px rgba(0,0,0,0.35);
  }

  .btn svg{ width:16px; height:16px; }

  .site-footer{
    position:relative;
    z-index:3;
    margin-top: 46px;
    font-size: 0.72rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color: #4a505a;
    opacity:0;
    animation: fadeUp 0.9s ease forwards 0.8s;
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }

  @media (max-width: 560px){
    .stage{ gap: 2px; padding-top: 200px; margin-top: -200px; }
    .crane-rig{ width: 420px; height: 220px; }
    .boom{ width: 320px; }
    @keyframes trolleyMove{
      0%,20%{  left: 30px; }
      32%{     left: 260px; }
      82%{     left: 260px; }
      100%{    left: 260px; }
    }
    @keyframes craneJourney{
      0%{      transform: translate(-140%, -300px); }
      16%{     transform: translate(-52%, -4px); }
      22%{     transform: translate(-52%, -4px); }
      78%{     transform: translate(-52%, -4px); }
      86%{     transform: translate(-52%, -14px); }
      100%{    transform: translate(90%, -300px); }
    }
  }
</style>
</head>
<body>

  <div class="grid-overlay"></div>
  <div class="vignette"></div>
  <div class="fog-layer" id="fogLayer"></div>
  <div class="caution-strip"></div>

  <main class="hero">
    <div class="eyebrow">Site Under Maintenance &mdash; Error 404</div>

    <div class="stage">
      <div class="stage-glow"></div>

      <div class="digit">4</div>

      <div class="coil-slot">
        <div class="impact-ring"></div>
        <div class="coil-final">
          <img src="image.png" class="coil" alt="Steel coil forming the number zero">
          <div class="shine"></div>
        </div>
      </div>

      <div class="digit second">4</div>

      <!-- Crane rig -->
      <div class="crane-rig">
        <div class="counter-jib"></div>
        <div class="counterweight"></div>
        <div class="tie-cable"></div>
        <div class="tie-cable two"></div>
        <div class="boom"></div>
        <div class="mast"></div>
        <div class="cab"></div>
        <div class="trolley"></div>
        <div class="cable-assembly">
          <div class="cable"></div>
          <div class="hook"></div>
          <div class="coil-carried">
            <img src="image.png" class="coil" alt="Steel coil being lifted by crane">
          </div>
        </div>
      </div>
    </div>

    <div class="copy">
      <h1>Oops! This page rolled away.</h1>
      <p>The page you're looking for doesn't exist or has been moved.</p>
      <div class="actions">
        <a class="btn btn-primary" href="/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
          Go Home
        </a>
        <button class="btn btn-ghost" onclick="if(history.length>1){history.back()}else{window.location.href='/'}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
          Go Back
        </button>
      </div>
    </div>

    <div class="site-footer">MahaveerTrans &middot; Yard Ops</div>
  </main>

<script>
  (function(){
    const layer = document.getElementById('fogLayer');
    const count = 16;
    for(let i=0;i<count;i++){
      const p = document.createElement('div');
      p.className = 'fog-particle';
      const size = 60 + Math.random()*160;
      const startX = Math.random()*100;
      const startY = 20 + Math.random()*80;
      const dx = (Math.random()*160-80) + 'px';
      const dy = (-(60 + Math.random()*140)) + 'px';
      const dur = 10 + Math.random()*14;
      const delay = Math.random()*10;
      p.style.width = size+'px';
      p.style.height = size+'px';
      p.style.left = startX+'%';
      p.style.top = startY+'%';
      p.style.setProperty('--dx', dx);
      p.style.setProperty('--dy', dy);
      p.style.animationDuration = dur+'s';
      p.style.animationDelay = delay+'s';
      layer.appendChild(p);
    }
  })();
</script>
<div id="craneDebug" style="position:fixed;bottom:16px;left:16px;z-index:9999;
  background:#1a1d23;border:1px solid #333;border-radius:10px;padding:12px 14px;
  font-family:monospace;font-size:12px;color:#eee;width:280px;">
  <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
    <strong>Crane Debug</strong>
    <button id="craneDebugToggle" style="cursor:pointer;">pause</button>
  </div>
  <input id="craneScrub" type="range" min="0" max="1" step="0.001" value="0" style="width:100%;">
  <div id="craneReadout" style="margin-top:8px;line-height:1.5;white-space:pre;"></div>
</div>

<script>
(function(){
  const rig = document.querySelector('.crane-rig');
  const trolley = document.querySelector('.trolley');
  const cable = document.querySelector('.cable');
  const els = document.querySelectorAll('.crane-rig, .trolley, .cable, .hook, .coil-carried, .coil-final, .impact-ring');
  const scrub = document.getElementById('craneScrub');
  const readout = document.getElementById('craneReadout');
  const toggleBtn = document.getElementById('craneDebugToggle');
  let paused = false;

  const duration = parseFloat(getComputedStyle(document.documentElement)
    .getPropertyValue('--crane-duration')) || 11;
  scrub.max = duration;

  function applyFreeze(t){
    els.forEach(el => {
      el.style.animationPlayState = 'paused';
      el.style.animationDelay = (-t) + 's';
    });
  }

  function readValues(){
    const m = new DOMMatrix(getComputedStyle(rig).transform);
    readout.textContent =
      `t = ${scrub.value}s / ${duration}s (${(scrub.value/duration*100).toFixed(1)}%)\n` +
      `crane-rig translate: ${m.m41.toFixed(1)}px, ${m.m42.toFixed(1)}px\n` +
      `trolley left: ${getComputedStyle(trolley).left}\n` +
      `cable height: ${getComputedStyle(cable).height}`;
  }

  scrub.addEventListener('input', () => {
    paused = true;
    toggleBtn.textContent = 'play';
    applyFreeze(parseFloat(scrub.value));
    readValues();
  });

  toggleBtn.addEventListener('click', () => {
    paused = !paused;
    if(paused){
      applyFreeze(parseFloat(scrub.value));
      toggleBtn.textContent = 'play';
    } else {
      els.forEach(el => { el.style.animationPlayState = ''; el.style.animationDelay = ''; });
      toggleBtn.textContent = 'pause';
    }
    readValues();
  });

  readValues();
})();
</script>

</body>
</html>
