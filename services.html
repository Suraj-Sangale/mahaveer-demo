<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Services — MahaveerTrans</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Instrument+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════ TOKENS ═══════════ */
:root{
  --bg:#ffffff;--bg2:#f9fafb;--bg3:#f3f4f6;
  --ink:#0d1117;--ink2:#1e2530;--ink3:#374151;
  --muted:#6b7280;--muted2:#9ca3af;
  --border:#e5e7eb;--border2:#d1d5db;--card:#ffffff;
  --dark-bg:#0d1117;--dark-bar:#080c14;
  --accent:#0ea5e9;--accent-dk:#0284c7;--accent-lt:#f0f9ff;
  --blue:#1d4ed8;--blue-lt:#eff6ff;
  --amber:#f59e0b;--amber-lt:#fffbeb;
  --green:#16a34a;--green-lt:#f0fdf4;
  --red:#dc2626;--red-lt:#fef2f2;
  --purple:#7c3aed;--purple-lt:#f5f3ff;
  --shadow:0 4px 16px rgba(0,0,0,0.07);
  --shadow-lg:0 20px 60px rgba(0,0,0,0.10);
  --shadow-bl:0 8px 32px rgba(14,165,233,0.25);
  --radius:12px;--radius-lg:20px;--radius-xl:28px;
  --font-d:'Syne',sans-serif;
  --font-b:'Instrument Sans',sans-serif;
  --tr:0.3s ease;
}
[data-theme="dark"]{
  --bg:#0d1117;--bg2:#111827;--bg3:#1e2533;
  --ink:#f1f5f9;--ink2:#e2e8f0;--ink3:#cbd5e1;
  --muted:#94a3b8;--muted2:#64748b;
  --border:#1e293b;--border2:#334155;--card:#141c2b;
  --dark-bg:#060a10;--dark-bar:#040710;
  --shadow:0 4px 24px rgba(0,0,0,0.35);
  --shadow-lg:0 20px 60px rgba(0,0,0,0.5);
  --accent-lt:#0c1929;--blue-lt:#0c1a30;--amber-lt:#1a1200;--green-lt:#061410;
  --red-lt:#1a0505;--purple-lt:#0f0a1e;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);overflow-x:hidden;transition:background var(--tr),color var(--tr);}
img{display:block;max-width:100%;}
a{text-decoration:none;color:inherit;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px;}

/* ═══════════ NAV ═══════════ */
nav{position:fixed;top:0;left:0;right:0;z-index:300;display:flex;align-items:center;justify-content:space-between;padding:0 5%;height:66px;background:rgba(255,255,255,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);transition:box-shadow .3s,background .3s;}
[data-theme="dark"] nav{background:rgba(13,17,23,0.88);}
nav.scrolled{box-shadow:var(--shadow);}
.nav-logo{font-family:var(--font-d);font-size:1.3rem;font-weight:800;color:var(--ink);letter-spacing:-.02em;display:flex;align-items:center;gap:.45rem;white-space:nowrap;}
.nav-logo .dot{width:7px;height:7px;background:var(--accent);border-radius:50%;animation:blink 2s ease-in-out infinite;flex-shrink:0;}
@keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(1.4);}}
.nav-links{display:flex;gap:.15rem;align-items:center;}
.nav-links a{color:var(--muted);font-size:.855rem;font-weight:500;padding:.4rem .85rem;border-radius:8px;transition:all .2s;}
.nav-links a:hover,.nav-links a.active{color:var(--ink);background:var(--bg3);}
.nav-links a.active{color:var(--accent);}
.nav-right{display:flex;align-items:center;gap:.65rem;}
.btn-ghost{background:none;border:1.5px solid var(--border2);color:var(--ink3);padding:.46rem 1.1rem;border-radius:8px;font-family:var(--font-b);font-size:.855rem;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap;}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn-cta{background:var(--ink);color:var(--bg);padding:.5rem 1.3rem;border-radius:8px;font-family:var(--font-b);font-size:.855rem;font-weight:600;border:none;cursor:pointer;transition:all .2s;white-space:nowrap;}
.btn-cta:hover{opacity:.85;transform:translateY(-1px);box-shadow:var(--shadow);}
.theme-toggle{width:44px;height:24px;border-radius:100px;background:var(--border2);border:none;cursor:pointer;position:relative;transition:background .3s;flex-shrink:0;}
.theme-toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--bg);transition:transform .3s;box-shadow:0 1px 4px rgba(0,0,0,.2);}
[data-theme="dark"] .theme-toggle{background:var(--accent);}
[data-theme="dark"] .theme-toggle::after{transform:translateX(20px);}
.theme-icon{font-size:.85rem;pointer-events:none;}

/* ═══════════ HAMBURGER ═══════════ */
.hamburger{display:none;flex-direction:column;justify-content:center;gap:5px;width:40px;height:40px;border:1.5px solid var(--border2);border-radius:8px;background:none;cursor:pointer;padding:8px;transition:border-color .2s;flex-shrink:0;}
.hamburger:hover{border-color:var(--accent);}
.ham-line{width:100%;height:1.5px;background:var(--ink);border-radius:2px;transition:transform .3s ease,opacity .3s ease;transform-origin:center;}
.hamburger.open .ham-line:nth-child(1){transform:translateY(6.5px) rotate(45deg);}
.hamburger.open .ham-line:nth-child(2){opacity:0;transform:scaleX(0);}
.hamburger.open .ham-line:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);}
.mob-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:250;backdrop-filter:blur(4px);opacity:0;transition:opacity .3s;}
.mob-overlay.open{opacity:1;}
.mob-drawer{position:fixed;top:0;right:0;bottom:0;width:min(320px,85vw);background:var(--card);z-index:260;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow-y:auto;border-left:1px solid var(--border);}
.mob-drawer.open{transform:translateX(0);}
.dr-header{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.25rem;border-bottom:1px solid var(--border);flex-shrink:0;}
.dr-logo{font-family:var(--font-d);font-size:1.2rem;font-weight:800;color:var(--ink);}
.dr-close{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--border2);background:none;cursor:pointer;color:var(--muted);font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.dr-close:hover{background:var(--bg3);color:var(--ink);}
.dr-links{display:flex;flex-direction:column;padding:1rem 0;flex:1;}
.dr-links a{display:flex;align-items:center;justify-content:space-between;padding:.85rem 1.25rem;color:var(--ink3);font-size:.95rem;font-weight:500;border-bottom:1px solid var(--border);transition:all .2s;}
.dr-links a:last-of-type{border-bottom:none;}
.dr-links a:hover,.dr-links a.active{color:var(--accent);background:var(--accent-lt);padding-left:1.5rem;}
.dr-links a::after{content:'→';color:var(--muted2);font-size:.8rem;}
.dr-links a:hover::after{color:var(--accent);}
.dr-foot{padding:1.25rem;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:.65rem;flex-shrink:0;}
.dr-theme{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.25rem;background:var(--bg2);border-radius:10px;}
.dr-theme-lbl{font-size:.82rem;font-weight:600;color:var(--ink3);}
.dr-cta{background:var(--ink);color:var(--bg);padding:.75rem;border-radius:8px;font-family:var(--font-b);font-size:.88rem;font-weight:600;border:none;cursor:pointer;width:100%;transition:all .2s;}
.dr-cta:hover{opacity:.85;}

/* ═══════════ BREADCRUMB ═══════════ */
.breadcrumb{display:flex;align-items:center;gap:.5rem;padding:5.25rem 5% 0;padding-bottom:0;}
.bc-item{font-size:.78rem;color:var(--muted);transition:color .2s;}
.bc-item:hover{color:var(--accent);}
.bc-sep{color:var(--muted2);font-size:.75rem;}
.bc-item.current{color:var(--accent);font-weight:600;}

/* ═══════════ HERO ═══════════ */
.svc-hero{padding:1.5rem 5% 0;position:relative;overflow:hidden;background:var(--bg);}
.svc-hero-bg{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:52px 52px;opacity:.4;pointer-events:none;}
.svc-hero-glow{position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 60% 60%,rgba(14,165,233,.07),transparent 70%);pointer-events:none;}
.svc-hero-inner{position:relative;z-index:2;max-width:760px;padding:3rem 0 5rem;}
.sec-tag{display:inline-flex;align-items:center;gap:.5rem;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:.75rem;}
.sec-tag::before{content:'';width:18px;height:2px;background:var(--accent);}
.sec-h{font-family:var(--font-d);font-size:clamp(2rem,4.5vw,3.8rem);font-weight:800;line-height:1.06;letter-spacing:-.03em;color:var(--ink);}
.sec-h .hl{color:var(--accent);}
.hero-desc{color:var(--muted);font-size:1.05rem;line-height:1.75;max-width:560px;margin:1.25rem 0 2rem;}
.hero-meta{display:flex;gap:2rem;flex-wrap:wrap;}
.hm-item{display:flex;flex-direction:column;gap:.2rem;}
.hm-val{font-family:var(--font-d);font-size:1.6rem;font-weight:800;color:var(--ink);line-height:1;}
.hm-val .s{color:var(--accent);}
.hm-lbl{font-size:.72rem;color:var(--muted);letter-spacing:.04em;}

/* ═══════════ TICKER ═══════════ */
.ticker-wrap{background:var(--dark-bg);overflow:hidden;padding:.82rem 0;}
.ticker{display:flex;width:max-content;animation:tick 40s linear infinite;}
.t-item{display:flex;align-items:center;gap:.5rem;padding:0 1.8rem;font-family:var(--font-d);font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45);white-space:nowrap;}
.t-dot{width:4px;height:4px;background:var(--accent);border-radius:50%;}
@keyframes tick{from{transform:translateX(0);}to{transform:translateX(-50%);}}

/* ═══════════ SHARED ═══════════ */
section{padding:5.5rem 5%;}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .65s ease,transform .65s ease;}
.reveal.vis{opacity:1;transform:translateY(0);}

/* ═══════════ SERVICE FILTER TABS ═══════════ */
#services-list{background:var(--bg2);}
.filter-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:3rem;}
.filter-btn{display:flex;align-items:center;gap:.5rem;padding:.5rem 1.1rem;border-radius:100px;border:1.5px solid var(--border2);background:none;color:var(--muted);font-family:var(--font-b);font-size:.82rem;font-weight:600;cursor:pointer;transition:all .25s;}
.filter-btn:hover{border-color:var(--accent);color:var(--accent);}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.filter-btn .f-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

/* ═══════════ SERVICE CARDS GRID ═══════════ */
.svc-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.5rem;}
.svc-card{background:var(--card);border-radius:var(--radius-xl);border:1px solid var(--border);overflow:hidden;transition:all .35s;opacity:0;transform:translateY(18px);cursor:pointer;display:flex;flex-direction:column;}
.svc-card.vis{opacity:1;transform:translateY(0);}
.svc-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:transparent;}
.svc-card.hidden{display:none;}
.svc-card-img{width:100%;height:200px;object-fit:cover;transition:transform .5s,filter .4s;filter:brightness(.85);}
.svc-card:hover .svc-card-img{transform:scale(1.04);filter:brightness(.75);}
.svc-card-img-wrap{overflow:hidden;position:relative;}
.svc-card-badge{position:absolute;top:.9rem;left:.9rem;display:flex;gap:.4rem;}
.svc-tag-pill{display:inline-flex;align-items:center;gap:.3rem;font-size:.65rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:.22rem .7rem;border-radius:100px;}
.tp-sky{background:var(--accent-lt);color:var(--accent);}
.tp-blue{background:var(--blue-lt);color:var(--blue);}
.tp-amber{background:var(--amber-lt);color:#b45309;}
.tp-green{background:var(--green-lt);color:var(--green);}
.tp-red{background:var(--red-lt);color:var(--red);}
.tp-purple{background:var(--purple-lt);color:var(--purple);}
.svc-card-body{padding:1.5rem 1.75rem;display:flex;flex-direction:column;flex:1;}
.svc-card-icon{font-size:1.75rem;margin-bottom:.75rem;}
.svc-card-title{font-family:var(--font-d);font-size:1.15rem;font-weight:700;color:var(--ink);margin-bottom:.55rem;}
.svc-card-desc{color:var(--muted);font-size:.875rem;line-height:1.68;margin-bottom:1.25rem;flex:1;}
.svc-card-features{display:flex;flex-direction:column;gap:.45rem;margin-bottom:1.5rem;}
.svc-feat{display:flex;align-items:center;gap:.55rem;font-size:.82rem;color:var(--ink3);}
.svc-feat::before{content:'✓';width:17px;height:17px;background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:800;flex-shrink:0;line-height:17px;text-align:center;}
.svc-card-footer{display:flex;align-items:center;justify-content:space-between;padding-top:1.1rem;border-top:1px solid var(--border);}
.svc-link{display:inline-flex;align-items:center;gap:.35rem;color:var(--accent);font-size:.82rem;font-weight:600;transition:gap .2s;}
.svc-link:hover{gap:.7rem;}
.svc-price-tag{font-size:.75rem;color:var(--muted);background:var(--bg3);padding:.25rem .7rem;border-radius:100px;}

/* ═══════════ PROCESS ═══════════ */
#how-it-works{background:var(--bg);}
.proc-head{text-align:center;margin-bottom:4.5rem;}
.proc-head .sec-tag{justify-content:center;}
.proc-head .sec-tag::before{display:none;}
.proc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2rem;position:relative;}
.proc-grid::before{content:'';position:absolute;top:2.6rem;left:calc(12.5% + 1rem);right:calc(12.5% + 1rem);height:1px;background:linear-gradient(to right,transparent,var(--accent),transparent);}
.pstep{text-align:center;opacity:0;transform:translateY(18px);}
.pstep.vis{opacity:1;transform:translateY(0);}
.pstep-n{width:52px;height:52px;border-radius:50%;background:var(--card);border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:1rem;font-weight:800;color:var(--muted);margin:0 auto 1.5rem;transition:all .3s;position:relative;z-index:1;}
.pstep:hover .pstep-n{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:var(--shadow-bl);}
.pstep-icon{font-size:1.2rem;margin-bottom:.6rem;}
.pstep-title{font-family:var(--font-d);font-size:1rem;font-weight:700;color:var(--ink);margin-bottom:.45rem;}
.pstep-desc{color:var(--muted);font-size:.83rem;line-height:1.6;}

/* ═══════════ NUMBERS STRIP ═══════════ */
#numbers{background:var(--dark-bg);display:grid;grid-template-columns:repeat(4,1fr);padding:0;}
.num-item{padding:3.25rem 2.25rem;border-right:1px solid rgba(255,255,255,.05);position:relative;overflow:hidden;transition:background .3s;}
.num-item:last-child{border-right:none;}
.num-item:hover{background:rgba(255,255,255,.02);}
.num-item::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(to right,var(--accent),#60a5fa);transform:scaleX(0);transform-origin:left;transition:transform .4s;}
.num-item:hover::after{transform:scaleX(1);}
.num-val{font-family:var(--font-d);font-size:2.85rem;font-weight:800;letter-spacing:-.03em;color:#fff;line-height:1;margin-bottom:.45rem;}
.num-val .suf{color:var(--accent);}
.num-lbl{font-size:.8rem;color:rgba(255,255,255,.38);font-weight:500;line-height:1.5;}

/* ═══════════ COVERAGE MAP SECTION ═══════════ */
#coverage{background:var(--bg2);}
.cov-grid{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center;}
.cov-visual{position:relative;}
.cov-img{width:100%;border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);height:380px;object-fit:cover;}
.cov-badge{position:absolute;bottom:-1.5rem;right:-1.5rem;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem 1.5rem;box-shadow:var(--shadow-lg);text-align:center;}
.cov-badge-val{font-family:var(--font-d);font-size:2.4rem;font-weight:800;color:var(--accent);line-height:1;}
.cov-badge-lbl{font-size:.75rem;color:var(--muted);margin-top:.2rem;line-height:1.4;}
.cov-content .sec-tag{margin-bottom:.75rem;}
.cov-content .sec-h{margin-bottom:1.2rem;}
.cov-content p{color:var(--muted);font-size:.93rem;line-height:1.75;margin-bottom:1.5rem;}
.cov-regions{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-bottom:2rem;}
.cov-region{display:flex;align-items:center;gap:.6rem;padding:.65rem .9rem;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);font-size:.83rem;color:var(--ink3);transition:all .2s;}
.cov-region:hover{border-color:var(--accent);color:var(--accent);}
.cov-region-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.btn-primary{background:var(--accent);color:#fff;padding:.78rem 1.9rem;border-radius:10px;font-family:var(--font-b);font-size:.92rem;font-weight:600;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:.45rem;transition:all .25s;box-shadow:var(--shadow-bl);}
.btn-primary:hover{background:var(--accent-dk);transform:translateY(-2px);box-shadow:0 12px 36px rgba(14,165,233,.35);}

/* ═══════════ COMPARISON TABLE ═══════════ */
#comparison{background:var(--bg);}
.comp-head{text-align:center;margin-bottom:3.5rem;}
.comp-head .sec-tag{justify-content:center;}
.comp-head .sec-tag::before{display:none;}
.comp-table-wrap{overflow-x:auto;border-radius:var(--radius-xl);border:1px solid var(--border);box-shadow:var(--shadow);}
.comp-table{width:100%;border-collapse:collapse;min-width:600px;}
.comp-table th{padding:1.1rem 1.5rem;text-align:left;font-family:var(--font-d);font-size:.82rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg2);border-bottom:1px solid var(--border);}
.comp-table th.hl-col{background:rgba(14,165,233,.06);color:var(--accent);}
.comp-table td{padding:1rem 1.5rem;font-size:.88rem;color:var(--ink3);border-bottom:1px solid var(--border);}
.comp-table tr:last-child td{border-bottom:none;}
.comp-table tr:hover td{background:var(--bg3);}
.comp-table td.hl-col{background:rgba(14,165,233,.04);}
.check{color:var(--green);font-weight:700;}
.cross{color:var(--muted2);}
.comp-badge{display:inline-block;background:var(--accent);color:#fff;font-size:.65rem;font-weight:700;padding:.15rem .55rem;border-radius:100px;margin-left:.4rem;vertical-align:middle;}

/* ═══════════ INDUSTRY VERTICALS ═══════════ */
#industries{background:var(--bg2);}
.ind-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:3rem;flex-wrap:wrap;gap:1.5rem;}
.ind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;}
.ind-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem 1.25rem;text-align:center;transition:all .3s;opacity:0;transform:translateY(18px);cursor:default;}
.ind-card.vis{opacity:1;transform:translateY(0);}
.ind-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);border-color:transparent;}
.ind-card::before{content:'';display:block;height:3px;background:linear-gradient(to right,var(--accent),#60a5fa);transform:scaleX(0);transform-origin:left;transition:transform .4s;border-radius:2px 2px 0 0;margin:-1.5rem -1.25rem 1rem;position:relative;top:0;}
.ind-card:hover::before{transform:scaleX(1);}
.ind-icon{font-size:2rem;margin-bottom:.75rem;}
.ind-name{font-family:var(--font-d);font-size:.95rem;font-weight:700;color:var(--ink);margin-bottom:.4rem;}
.ind-desc{font-size:.78rem;color:var(--muted);line-height:1.5;}

/* ═══════════ TRACKING CTA ═══════════ */
#track-cta{background:linear-gradient(135deg,#0d1117 0%,#0f1e35 100%);position:relative;overflow:hidden;}
#track-cta::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 80% 50%,rgba(14,165,233,.15),transparent);pointer-events:none;}
.track-inner{display:grid;grid-template-columns:1fr 1fr;gap:4.5rem;align-items:center;position:relative;z-index:1;}
.track-left .sec-tag{color:var(--accent);}
.track-left .sec-h{color:#f1f5f9;margin-bottom:.9rem;}
.track-left>p{color:rgba(255,255,255,.45);line-height:1.75;font-size:.93rem;margin-bottom:1.75rem;}
.t-input-row{display:flex;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);border-radius:10px;overflow:hidden;transition:border-color .25s;}
.t-input-row:focus-within{border-color:var(--accent);}
.t-input{flex:1;background:transparent;border:none;outline:none;padding:.85rem 1.2rem;color:#fff;font-family:var(--font-b);font-size:.92rem;}
.t-input::placeholder{color:rgba(255,255,255,.28);}
.t-btn{background:var(--accent);color:#fff;border:none;padding:.85rem 1.35rem;cursor:pointer;font-family:var(--font-b);font-size:.88rem;font-weight:600;transition:background .2s;white-space:nowrap;}
.t-btn:hover{background:var(--accent-dk);}
.t-hints{display:flex;gap:1.25rem;flex-wrap:wrap;margin-top:.65rem;}
.t-hint{color:rgba(255,255,255,.35);font-size:.75rem;display:flex;align-items:center;gap:.35rem;}
.t-hint::before{content:'✓';color:var(--accent);}
.track-right{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:var(--radius-xl);padding:2.25rem;}
.tc-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.6rem;}
.tc-id{font-family:var(--font-d);font-size:.88rem;font-weight:700;color:#f1f5f9;}
.tc-status{background:rgba(34,197,94,.15);color:#4ade80;font-size:.68rem;font-weight:700;letter-spacing:.07em;padding:.25rem .75rem;border-radius:100px;border:1px solid rgba(34,197,94,.2);}
.tc-route{display:flex;align-items:center;gap:.9rem;margin-bottom:1.75rem;}
.tc-city{flex:1;}
.tc-cn{font-family:var(--font-d);font-size:1.05rem;font-weight:700;color:#f1f5f9;}
.tc-cc{color:rgba(255,255,255,.32);font-size:.72rem;margin-top:.1rem;}
.tc-arrow{color:var(--accent);font-size:1.1rem;}
.tc-tl{display:flex;flex-direction:column;}
.tl-row{display:flex;gap:.9rem;padding:.65rem 0;border-bottom:1px solid rgba(255,255,255,.04);}
.tl-row:last-child{border-bottom:none;}
.tl-d{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.tl-done{background:var(--accent);}
.tl-now{background:#f59e0b;animation:blink 1.4s infinite;}
.tl-pending{background:rgba(255,255,255,.14);}
.tl-title{font-size:.83rem;font-weight:500;color:#e2e8f0;}
.tl-time{font-size:.72rem;color:rgba(255,255,255,.32);margin-top:.08rem;}

/* ═══════════ TESTIMONIALS ═══════════ */
#testimonials{background:var(--bg);}
.test-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:3.5rem;flex-wrap:wrap;gap:1.5rem;}
.test-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem;}
.tc{background:var(--card);border-radius:var(--radius-lg);padding:1.85rem;border:1px solid var(--border);transition:all .3s;opacity:0;transform:translateY(18px);}
.tc.vis{opacity:1;transform:translateY(0);}
.tc:hover{box-shadow:var(--shadow-lg);border-color:transparent;transform:translateY(-4px);}
.tc-stars{color:var(--amber);font-size:.82rem;letter-spacing:.12em;margin-bottom:.9rem;}
.tc-text{color:var(--ink3);font-size:.9rem;line-height:1.75;margin-bottom:1.35rem;font-style:italic;}
.tc-author{display:flex;align-items:center;gap:.8rem;}
.tc-av{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--border);}
.tc-name{font-size:.86rem;font-weight:600;color:var(--ink);}
.tc-role{font-size:.75rem;color:var(--muted);margin-top:.08rem;}

/* ═══════════ FAQ ═══════════ */
#faq{background:var(--bg2);}
.faq-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;max-width:900px;margin:0 auto;}
.faq-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;transition:all .2s;}
.faq-item:hover{border-color:var(--accent);}
.faq-q{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.25rem;cursor:pointer;font-size:.9rem;font-weight:600;color:var(--ink);gap:.75rem;}
.faq-icon{width:22px;height:22px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.8rem;color:var(--muted);transition:all .3s;}
.faq-item.open .faq-icon{background:var(--accent);border-color:var(--accent);color:#fff;transform:rotate(45deg);}
.faq-a{font-size:.85rem;color:var(--muted);line-height:1.7;padding:0 1.25rem;max-height:0;overflow:hidden;transition:max-height .35s ease,padding .3s;}
.faq-item.open .faq-a{max-height:200px;padding-bottom:1.1rem;}

/* ═══════════ CTA BANNER ═══════════ */
#cta-banner{background:var(--dark-bg);position:relative;overflow:hidden;text-align:center;padding:7.5rem 5%;}
#cta-banner::before{content:'';position:absolute;inset:0;background-image:url('https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=1600&q=80&auto=format&fit=crop');background-size:cover;background-position:center;opacity:.07;}
#cta-banner::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 55% 75% at 50% 50%,rgba(14,165,233,.18),transparent);pointer-events:none;}
.cta-inner{position:relative;z-index:2;max-width:660px;margin:0 auto;}
.cta-inner .sec-tag{justify-content:center;color:var(--accent);}
.cta-inner .sec-tag::before{display:none;}
.cta-inner .sec-h{color:#f1f5f9;font-size:clamp(2.2rem,4.5vw,3.6rem);margin-bottom:1.1rem;}
.cta-inner>p{color:rgba(255,255,255,.42);line-height:1.75;font-size:.97rem;margin-bottom:2.25rem;}
.cta-btns{display:flex;gap:.85rem;justify-content:center;flex-wrap:wrap;}
.btn-w{background:#fff;color:var(--dark-bg);padding:.82rem 1.9rem;border-radius:10px;font-family:var(--font-b);font-size:.92rem;font-weight:700;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:.45rem;transition:all .25s;}
.btn-w:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(255,255,255,.12);}
.btn-wg{background:rgba(255,255,255,.07);color:rgba(255,255,255,.78);padding:.82rem 1.9rem;border-radius:10px;font-family:var(--font-b);font-size:.92rem;font-weight:600;border:1.5px solid rgba(255,255,255,.1);cursor:pointer;display:inline-flex;align-items:center;gap:.45rem;transition:all .25s;}
.btn-wg:hover{border-color:var(--accent);color:var(--accent);}

/* ═══════════ FOOTER ═══════════ */
footer{background:var(--dark-bar);padding:4.5rem 5% 2rem;}
.f-top{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:3.5rem;margin-bottom:3.5rem;padding-bottom:3.5rem;border-bottom:1px solid rgba(255,255,255,.05);}
.f-brand-logo{font-family:var(--font-d);font-size:1.35rem;font-weight:800;color:#fff;display:block;margin-bottom:.9rem;letter-spacing:-.02em;}
.f-brand p{color:rgba(255,255,255,.3);font-size:.855rem;line-height:1.7;max-width:240px;}
.f-socs{display:flex;gap:.55rem;margin-top:1.35rem;}
.f-soc{width:34px;height:34px;border-radius:8px;border:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;transition:all .2s;}
.f-soc:hover{border-color:var(--accent);color:var(--accent);}
.f-col h4{font-family:var(--font-d);font-size:.76rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.42);margin-bottom:1.35rem;}
.f-links{list-style:none;display:flex;flex-direction:column;gap:.6rem;}
.f-links a{color:rgba(255,255,255,.3);font-size:.855rem;transition:color .2s;}
.f-links a:hover{color:#fff;}
.f-bottom{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.9rem;}
.f-bottom p{color:rgba(255,255,255,.18);font-size:.78rem;}
.fab{position:fixed;bottom:1.75rem;right:1.75rem;z-index:400;background:var(--accent);color:#fff;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.25rem;box-shadow:0 8px 28px rgba(14,165,233,.42);animation:fab-p 3s ease-in-out infinite;cursor:pointer;border:none;transition:all .25s;}
.fab:hover{background:var(--accent-dk);transform:scale(1.08);}
@keyframes fab-p{0%,100%{box-shadow:0 8px 28px rgba(14,165,233,.42);}50%{box-shadow:0 8px 44px rgba(14,165,233,.68);}}

/* ═══════════ RESPONSIVE ═══════════ */
@media(max-width:1024px){

  .track-inner{grid-template-columns:1fr;gap:2.5rem;}

  .faq-grid{grid-template-columns:1fr;}
  .f-top{grid-template-columns:1fr 1fr;gap:2.5rem;}
}
@media(max-width:640px){

  .breadcrumb{padding:4.5rem 4% 0;}

  .hm-val{font-size:1.3rem;}
  .svc-cards{grid-template-columns:1fr;}

  .pstep-content{flex:1;}
  #numbers{grid-template-columns:1fr 1fr;}
  .num-item{padding:2rem 1.25rem;}
  .num-val{font-size:1.9rem;}
  .ind-grid{grid-template-columns:1fr 1fr;}
  .test-grid{grid-template-columns:1fr;}
  .cov-regions{grid-template-columns:1fr;}
  .cta-btns{flex-direction:column;align-items:center;}
  .btn-w,.btn-wg{width:100%;max-width:340px;justify-content:center;}
  .f-top{grid-template-columns:1fr;gap:2rem;padding-bottom:2rem;margin-bottom:2rem;}
  .f-bottom{flex-direction:column;text-align:center;}

  .ind-head{flex-direction:column;align-items:flex-start;gap:.75rem;}
}
@media(max-width:380px){
  #numbers{grid-template-columns:1fr;}
  .num-item:nth-child(odd){border-right:none;}
}

/* ════ OBSERVERS ════ */
function initObservers(){
  const io = new IntersectionObserver(e=>{
    e.forEach(x=>{ if(x.isIntersecting) x.target.classList.add('vis'); });
  },{threshold:0.1});
  document.querySelectorAll('.svc-card,.pstep,.ind-card,.tc,.reveal').forEach(el=>io.observe(el));
}

/* ════ COUNTERS ════ */
function initCounters(){
  const cio = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(!e.isIntersecting) return;
      const el=e.target, target=parseInt(el.dataset.target), suf=el.querySelector('.suf').textContent;
      let v=0; const step=target/65;
      const t=setInterval(()=>{
        v=Math.min(v+step,target);
        el.innerHTML=Math.floor(v).toLocaleString()+'<span class="suf">'+suf+'</span>';
        if(v>=target) clearInterval(t);
      },22);
      cio.unobserve(el);
    });
  },{threshold:.5});
  document.querySelectorAll('.num-val[data-target]').forEach(el=>cio.observe(el));
}

/* ════ THEME ════ */
function applyTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('mt-theme',t);}
function toggleTheme(){applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');}
document.getElementById('themeToggle').addEventListener('click',toggleTheme);
document.getElementById('themeToggleMob').addEventListener('click',toggleTheme);
const saved=localStorage.getItem('mt-theme'); if(saved) applyTheme(saved);

/* ════ DRAWER ════ */
const ham=document.getElementById('hamburger'), drw=document.getElementById('mobDrawer'), ov=document.getElementById('mobOverlay');
function openD(){ham.classList.add('open');drw.classList.add('open');ov.classList.add('open');document.body.style.overflow='hidden';}
function closeD(){ham.classList.remove('open');drw.classList.remove('open');ov.classList.remove('open');document.body.style.overflow='';}
ham.addEventListener('click',openD);
document.getElementById('drClose').addEventListener('click',closeD);
ov.addEventListener('click',closeD);
document.getElementById('drLinks').addEventListener('click',e=>{if(e.target.tagName==='A') closeD();});

/* ════ NAV SCROLL ════ */
window.addEventListener('scroll',()=>document.getElementById('navbar').classList.toggle('scrolled',scrollY>40));

/* ════ FILTER TABS ════ */
document.addEventListener('click',e=>{
  const btn=e.target.closest('.filter-btn');
  if(!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const cat=btn.dataset.filter;
  document.querySelectorAll('.svc-card').forEach(card=>{
    card.classList.toggle('hidden', cat!=='all' && card.dataset.cat!==cat);
  });
});

/* ════ FAQ ACCORDION ════ */
document.addEventListener('click',e=>{
  const q=e.target.closest('.faq-q');
  if(!q) return;
  const item=q.closest('.faq-item');
  const wasOpen=item.classList.contains('open');
  document.querySelectorAll('.faq-item').forEach(i=>i.classList.remove('open'));
  if(!wasOpen) item.classList.add('open');
});

/* ════ TRACK BTN ════ */
document.getElementById('trackBtn').addEventListener('click',function(){
  const v=document.getElementById('trackInput').value.trim();
  const D=PAGE.tracking;
  if(v){this.textContent=D.btnSuccess;this.style.background='#16a34a';setTimeout(()=>{this.textContent=D.btnLabel;this.style.background='';},2500);}
  else{document.getElementById('trackInput').style.outline='2px solid #ef4444';setTimeout(()=>{document.getElementById('trackInput').style.outline='';},2000);}
});

/* ════ BOOT ════ */
render(PAGE);
initObservers();
initCounters();
</script>
</body>
</html>
